services:
  - type: web
    name: ai-assessment-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: AI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
